name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" ruff==0.17.6
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      # The WebSocket schema and fixtures live only in p99-login-proxy.
      - name: Check out p99-login-proxy (wire schema)
        uses: actions/checkout@v4
        with:
          repository: eq-p99-tools/p99-login-proxy
          ref: rust
          path: p99-login-proxy
      - name: Test config
        run: printf '[discord]\ntoken = ci\n\n[sso]\nencryption_key = ci-encryption-key\n' > batphone.ini
      - name: Pytest
        env:
          P99_LOGIN_PROXY_DIR: ${{ github.workspace }}/p99-login-proxy
        run: pytest
